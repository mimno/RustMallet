[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pyrmallet"
requires-python = ">=3.9"
version = "0.1.1"
description = "Fast LDA topic modeling — Python bindings for RustMallet"
readme = "pyrmallet/README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Mimno", email = "mimno@cornell.edu" }]
keywords = ["lda", "topic-modeling", "nlp", "gibbs-sampling", "mallet"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = ["numpy"]

[project.urls]
Homepage = "https://github.com/mimno/RustMallet"
Repository = "https://github.com/mimno/RustMallet"
Changelog = "https://github.com/mimno/RustMallet/blob/main/CHANGELOG.md"
Issues = "https://github.com/mimno/RustMallet/issues"

[tool.maturin]
features = ["python"]
module-name = "pyrmallet._rust_mallet"
profile = "release"
